<style>
  body {
    background-color: #f8f9ff;
    background-image:
      radial-gradient(circle at 100% 0%, #e5eeff 0%, transparent 25%),
      radial-gradient(circle at 0% 100%, #d2e4fc 0%, transparent 25%);
    min-height: 100vh;
  }
  .login-card { background: #ffffff; border: 1px solid rgba(110, 121, 128, 0.2); width: 100%; max-width: 620px; }
  .input-focus-ring:focus-within { border-color: #34b3e8; border-width: 2px; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }

  #hub-app { display:none; height:100vh; width:100vw; overflow:hidden; position:relative; }
  #hub-app.show { display:block; }
  #login-screen.hide, #login-footer.hide { display:none; }

  #hub-sidebar { position:absolute; top:0; left:0; bottom:0; width:64px; z-index:30; background:#F1F4FA; border-right:1px solid #C1C6D6; display:flex; flex-direction:column; align-items:stretch; padding-top:14px; overflow:hidden; transition: width .18s ease, box-shadow .18s ease; }
  #hub-sidebar:hover { width:236px; overflow:visible; box-shadow:4px 0 18px rgba(11,28,48,0.18); }
  #hub-nav { flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; scrollbar-width:thin; scrollbar-color:#C1C6D6 transparent; }
  #hub-nav::-webkit-scrollbar { width:5px; }
  #hub-nav::-webkit-scrollbar-thumb { background:#C1C6D6; border-radius:4px; }
  #hub-nav::-webkit-scrollbar-track { background:transparent; }
  .hub-brand { text-align:center; padding:0 8px 14px 8px; border-bottom:1px solid #C1C6D6; margin-bottom:6px; }
  .hub-brand .dot { width:10px;height:10px;border-radius:50%;background:#FDBC13; margin:0 auto 6px auto; }
  .hub-brand span { color:#005BBF; font-size:9.5px; font-weight:700; letter-spacing:.04em; }
  .hub-user-tag { text-align:center; padding:6px 4px 10px 4px; border-bottom:1px solid #C1C6D6; margin-bottom:6px; }
  .hub-user-tag .name { font-size:10px; font-weight:700; color:#181C20; word-break:break-word; }
  .hub-user-tag .role { font-size:8.5px; color:#727785; text-transform:uppercase; letter-spacing:.03em; }

  .hub-nav-item { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:13px 6px; cursor:pointer; color:#414754; text-align:center; border-left:3px solid transparent; transition: background .15s ease, color .15s ease; white-space:nowrap; }
  .hub-nav-item:hover { background:#E5E8EE; color:#181C20; }
  .hub-nav-item.active { color:#00723D; border-left:3px solid #006D3A; background:#7FF8A8; }
  .hub-nav-item .ic { width:26px; height:26px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .hub-nav-item .lbl { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.02em; line-height:1.15; display:none; }
  #hub-sidebar:hover .hub-nav-item { flex-direction:row; justify-content:flex-start; gap:14px; padding:13px 18px; }
  #hub-sidebar:hover .hub-nav-item .lbl { display:block; font-size:12px; }

  .hub-footer-item { display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 6px; cursor:pointer; color:#727785; text-align:center; white-space:nowrap; }
  .hub-footer-item:hover { color:#BA1A1A; }
  .hub-footer-item .lbl { font-size:8.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; display:none; }
  #hub-sidebar:hover .hub-footer-item { flex-direction:row; justify-content:flex-start; gap:14px; padding:10px 18px; }
  #hub-sidebar:hover .hub-footer-item .lbl { display:block; }

  #hub-main { flex:1; position:relative; background:#FFFFFF; }
  .hub-frame-wrap { position:absolute; inset:0; display:none; }
  .hub-frame-wrap.active { display:block; }
  .hub-frame-wrap iframe { width:100%; height:100%; border:0; display:block; background:#fff; }
  .hub-loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#727785; font-size:13px; font-family: system-ui, sans-serif; gap:10px; }
  .hub-loading .spin { width:18px;height:18px;border-radius:50%;border:2px solid #C1C6D6;border-top-color:#005BBF; animation:hubspin .8s linear infinite; }
  @keyframes hubspin { to { transform: rotate(360deg); } }

  .hub-placeholder { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; color:#414754; font-family: system-ui, sans-serif; text-align:center; padding:2rem; }
  .hub-placeholder .material-symbols-outlined { font-size:56px; color:#9AA3AF; }
  .hub-placeholder h2 { font-size:20px; font-weight:700; color:#181C20; margin:0; }
  .hub-placeholder p { font-size:13.5px; color:#727785; max-width:360px; margin:0; }

  #login-loading { display:none; }
  #login-loading.show { display:flex; }

  /* ── Home de categorías ── */
  #hub-home, #hub-category { position:absolute; inset:0; display:none; }
  #hub-home.active { display:flex; flex-direction:column; }
  #hub-category.active { display:flex; flex-direction:row; }

  #hub-home { background:#F1F4FA; overflow-y:auto; }
  .hub-home-header { display:flex; align-items:center; justify-content:space-between; padding:18px 28px; border-bottom:1px solid #C1C6D6; background:#ffffff; flex-shrink:0; }
  .hub-home-header .brand { display:flex; align-items:center; gap:8px; }
  .hub-home-header .brand .dot { width:10px; height:10px; border-radius:50%; background:#FDBC13; }
  .hub-home-header .brand span { color:#005BBF; font-size:12px; font-weight:700; letter-spacing:.04em; }
  .hub-home-header .user-block { display:flex; align-items:center; gap:14px; }
  .hub-home-header .user-block .name { font-size:13px; font-weight:700; color:#181C20; text-align:right; }
  .hub-home-header .user-block .role { font-size:10.5px; color:#727785; text-transform:uppercase; letter-spacing:.03em; text-align:right; }
  .hub-home-logout { display:flex; align-items:center; gap:4px; color:#727785; cursor:pointer; padding:8px 10px; border-radius:8px; transition: all .15s ease; font-size:12px; font-weight:700; }
  .hub-home-logout:hover { color:#BA1A1A; background:#FDEDEC; }

  .hub-home-intro { padding:26px 28px 4px 28px; }
  .hub-home-intro h1 { font-family:'Hanken Grotesk',sans-serif; font-size:24px; font-weight:700; color:#181C20; margin:0 0 4px 0; }
  .hub-home-intro p { font-size:13.5px; color:#727785; margin:0; }

  .hub-home-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(520px,1fr)); gap:52px; padding:22px 28px 36px 28px; }
  .hub-home-card { position:relative; border-radius:44px; padding:64px 52px; min-height:460px; display:flex; flex-direction:column; justify-content:space-between; cursor:pointer; overflow:hidden; box-shadow:0 4px 14px rgba(11,28,48,0.12); transition: transform .18s ease, box-shadow .18s ease; background-size:cover; background-position:center; }
  .hub-home-card::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.28) 100%); }
  .hub-home-card:hover { transform:translateY(-5px) scale(1.015); box-shadow:0 10px 22px rgba(11,28,48,0.22); }
  .hub-home-card .hc-icon { position:relative; z-index:1; width:60px; height:60px; border-radius:14px; background:rgba(255,255,255,0.22); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; }
  .hub-home-card .hc-icon.has-logo { background:#fff; padding:5px; box-sizing:border-box; }
  .hub-home-card .hc-icon .material-symbols-outlined { color:#fff; font-size:32px; }
  .hub-home-card .hc-label { position:relative; z-index:1; color:#fff; font-family:'Hanken Grotesk',sans-serif; font-size:48px; font-weight:700; line-height:1.2; }
  .hub-home-card .hc-sub { position:relative; z-index:1; color:rgba(255,255,255,0.88); font-size:26px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; display:flex; align-items:center; gap:8px; margin-top:10px; }
  .hub-home-card.disabled { cursor:not-allowed; filter:grayscale(0.65); opacity:.55; }
  .hub-home-card.disabled:hover { transform:none; box-shadow:0 4px 14px rgba(11,28,48,0.12); }

  /* ── Vista de categoría (sidebar + iframe) ── */
  .hub-back-btn { display:flex; flex-direction:column; align-items:center; gap:4px; padding:14px 6px 10px 6px; cursor:pointer; color:#005BBF; text-align:center; border-bottom:1px solid #C1C6D6; margin-bottom:4px; white-space:nowrap; }
  .hub-back-btn:hover { background:#E5E8EE; }
  .hub-back-btn .lbl { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.02em; display:none; }
  #hub-sidebar:hover .hub-back-btn { flex-direction:row; justify-content:flex-start; padding:14px 18px 10px 18px; gap:14px; }
  #hub-sidebar:hover .hub-back-btn .lbl { display:block; }
  .hub-cat-badge { text-align:center; padding:4px 6px 12px 6px; border-bottom:1px solid #C1C6D6; margin-bottom:6px; display:none; white-space:nowrap; }
  .hub-cat-badge .lbl { font-size:10.5px; font-weight:700; color:#181C20; text-transform:uppercase; letter-spacing:.03em; }
  #hub-sidebar:hover .hub-cat-badge { display:block; text-align:left; padding-left:18px; }
  .hub-nav-group, .hub-main-group { display:none; }
  .hub-nav-group.active { display:block; }
  .hub-main-group.active { display:block; position:absolute; inset:0; }
  #hub-main-container { flex:1; position:relative; background:#FFFFFF; margin-left:64px; }
  .hub-empty-cat { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:#727785; font-family: system-ui, sans-serif; text-align:center; padding:2rem; }
  .hub-empty-cat .material-symbols-outlined { font-size:48px; color:#9AA3AF; }
</style>
</head>
<body class="font-body-md text-on-surface flex flex-col min-h-screen">

<!-- ══════════ PANTALLA DE LOGIN ══════════ -->
<main id="login-screen" class="flex-grow flex items-center justify-center px-4 py-12">
<div class="login-card p-margin-desktop rounded-lg flex flex-col items-center">
  <header class="text-center mb-4">
    <div class="flex justify-center">
      <img alt="Logo" class="w-auto" style="height:220px;" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAq2PgLP5eS8wUO0S5YxPyUqbkaIDRe5lEJeVNOcgz1fgdHH8a8HVnLqFcYDinES7ZXhqXUmSqp5Afw5-uQaci1Cdgyt700-iNe5QU-HEBS0TEQALRGgEV7hewF5u826Z5TqSUqAMYhtFmEUzbd0O1pupaw2uBAym0A7zoZWSwSHrnzTWI03DxbERNlw55P6s1M8jkkNMzJCCXFtpCfFQ6X_us3W3eJ-9MCgSL7CbRG2zNpcDNVUl3g-86fgR4s130Ix68"/>

      <label class="block font-label-md text-label-md text-on-surface-variant" for="usuario">Usuario</label>
      <div class="relative group input-focus-ring border border-outline-variant rounded-lg">

      <label class="block font-label-md text-label-md text-on-surface-variant" for="contrasena">Contraseña</label>

          <span class="material-symbols-outlined text-[20px]">lock</span>

        <input class="w-full pl-10 pr-10 py-3 bg-surface-container-low rounded-lg font-body-md text-on-surface focus:outline-none border-0" id="contrasena" name="password" placeholder="••••••••" type="password" autocomplete="current-password"/>

      <button id="login-btn" class="w-full bg-primary-container text-on-primary py-4 px-6 rounded-lg font-label-md text-label-md shadow-none hover:bg-primary transition-all active:scale-[0.98] flex justify-center items-center gap-2" type="submit">
        <span id="login-loading" class="items-center gap-2">
          <span class="inline-block w-4 h-4 border-2 border-white/60 border-t-white rounded-full animate-spin"></span>
          Verificando…

        <span id="login-btn-label" class="flex items-center gap-2">
          <span>Iniciar Sesión</span>
          <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
        </span>
      </button>

</div>
</main>

<footer id="login-footer" class="w-full px-margin-desktop py-gutter flex flex-col md:flex-row justify-between items-center bg-surface border-t border-outline-variant gap-2">
  <div class="font-label-sm text-label-sm text-on-surface-variant text-center md:text-left">
    Omar's Semi-Automated Warehouse Management System
  </div>
  <div class="font-label-sm text-label-sm text-on-surface-variant text-center md:text-right">
    Acceso por roles — cada usuario ve solo lo que le corresponde.
  </div>
</footer>

<!-- ══════════ HUB (post-login) ══════════ -->
<div id="hub-app">

  <!-- HOME: tarjetas por categoría -->
  <div id="hub-home">
    <header class="hub-home-header">
      <div class="brand"><div class="dot"></div><span>PANEL</span></div>
      <div class="user-block">
        <div>
          <div class="name" id="home-user-name">—</div>
          <div class="role" id="home-user-role">—</div>
        </div>
        <div class="hub-home-logout" onclick="hubLogout()" title="Cerrar sesión">
          <span class="material-symbols-outlined" style="font-size:18px;">logout</span> Salir

      </div>
    </header>
    <div class="hub-home-intro">
      <h1 id="hub-home-greeting">¿A dónde quieres ir?</h1>
      <p>Selecciona una categoría para ver sus secciones.</p>

    <div class="hub-home-grid" id="hub-home-grid"></div>

  <!-- VISTA DE CATEGORÍA: sidebar + iframes -->

      <div class="hub-back-btn" onclick="hubGoHome()" title="Volver al inicio">
        <span class="material-symbols-outlined" style="font-size:22px;">arrow_back</span>
        <div class="lbl">Volver</div>
      </div>
      <div class="hub-cat-badge"><div class="lbl" id="hub-cat-title">—</div></div>
      <div id="hub-nav-container" style="flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; scrollbar-width:thin; scrollbar-color:#C1C6D6 transparent;"></div>
      <div class="hub-footer-item" onclick="hubLogout()" title="Cerrar sesión">
        <span class="material-symbols-outlined" style="font-size:20px;">logout</span>
        <div class="lbl">Salir</div>
      </div>
    </aside>

    <main id="hub-main-container"></main>
  </div>

</div>

    DESPACHO:  { label: 'Despacho',  icon: 'local_shipping', gradient: 'linear-gradient(135deg,#2dd4bf,#065f46)', image: null },
    RECEPCION: { label: 'Recepción', icon: 'move_to_inbox',  gradient: 'linear-gradient(135deg,#fb923c,#c2410c)', image: null }
  };
  const GROUP_ORDER = ['KAMILL', 'GLIMMER', 'DERMODIS', 'DESPACHO', 'RECEPCION'];

  // ═══════════════════════════════════════════════════════════

  const loginScreen  = document.getElementById('login-screen');
  const loginFooter  = document.getElementById('login-footer');
  const hubApp       = document.getElementById('hub-app');
  const loginForm    = document.getElementById('login-form');
  const loginError   = document.getElementById('login-error');
  const loginLoading = document.getElementById('login-loading');
  const loginBtnLbl  = document.getElementById('login-btn-label');
  const loginBtn     = document.getElementById('login-btn');

  // ── Parser CSV simple (soporta comillas) ──
  function parseCSV(text) {
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i], n = text[i+1];
      if (inQuotes) {
        if (c === '"' && n === '"') { field += '"'; i++; }
        else if (c === '"') { inQuotes = false; }
        else { field += c; }
      } else {
        if (c === '"') inQuotes = true;
        else if (c === ',') { row.push(field); field = ''; }
        else if (c === '\r') { /* skip */ }
        else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
        else field += c;
      }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    if (!rows.length) return [];
    const headers = rows[0].map(h => h.trim());
    return rows.slice(1).filter(r => r.some(v => (v||'').trim() !== '')).map(r => {
      const obj = {};
      headers.forEach((h, idx) => { obj[h] = (r[idx] !== undefined ? r[idx] : '').trim(); });
      return obj;
    });
  }

  async function fetchCSV(url) {
    const res = await fetch(url + (url.includes('?') ? '&' : '?') + 'cb=' + Date.now());
    if (!res.ok) throw new Error('No se pudo leer la hoja (' + res.status + ')');
    return parseCSV(await res.text());
  }

  function setLoading(isLoading) {
    if (isLoading) { loginLoading.classList.add('show','flex'); loginBtnLbl.classList.add('hidden'); loginBtn.disabled = true; }
    else { loginLoading.classList.remove('show','flex'); loginBtnLbl.classList.remove('hidden'); loginBtn.disabled = false; }
  }

  async function attemptLogin() {
    const uInput = document.getElementById('usuario');
    const pInput = document.getElementById('contrasena');
    const u = (uInput.value || '').trim().toLowerCase();
    const p = (pInput.value || '').trim();
    if (!u || !p) return;

    loginError.classList.add('hidden');
    setLoading(true);
    try {
      const [usuarios, roles] = await Promise.all([ fetchCSV(USUARIOS_CSV), fetchCSV(ROLES_CSV) ]);
      const match = usuarios.find(function (row) {
        const rowUser = (row.USUARIO || row.usuario || '').trim().toLowerCase();
        const rowPass = (row.CLAVE || row.clave || '').trim();
        return rowUser === u && rowPass.toLowerCase() === p.toLowerCase();
      });

      if (!match) {
        loginError.textContent = 'Usuario o contraseña incorrectos.';
        loginError.classList.remove('hidden');
        setLoading(false);
        return;
      }

      const rolNombre = (match.ROL || match.rol || '').trim();
      const rolRow = roles.find(function (row) {
        return (row.ROL || row.rol || '').trim().toLowerCase() === rolNombre.toLowerCase();
      });

      if (!rolRow) {
        loginError.textContent = 'Tu usuario no tiene un rol configurado correctamente. Contacta al administrador.';
        loginError.classList.remove('hidden');
        setLoading(false);
        return;
      }

      const allowed = Object.keys(SECTIONS).filter(function (key) {
        const val = (rolRow[key] || '').trim().toUpperCase();
        return val === 'TRUE' || val === 'VERDADERO' || val === '1';
      });

      if (!allowed.length) {
        loginError.textContent = 'Tu rol no tiene ninguna sección habilitada. Contacta al administrador.';
        loginError.classList.remove('hidden');
        setLoading(false);
        return;
      }

      // Ofrecer al navegador guardar la contraseña (Chrome / Edge)
      if (window.PasswordCredential) {
        try {
          const cred = new PasswordCredential({ id: u, password: p, name: u });
          navigator.credentials.store(cred);
        } catch (e) { /* navegador sin soporte, se ignora */ }
      }

      const session = { usuario: match.USUARIO || match.usuario, rol: rolNombre, allowed: allowed };
      sessionStorage.setItem('panel_auth', JSON.stringify(session));
      setLoading(false);
      showHub(session);

    } catch (err) {
      console.error(err);
      loginError.textContent = 'No se pudo verificar el acceso. Revisa tu conexión e intenta de nuevo.';
      loginError.classList.remove('hidden');
      setLoading(false);
    }
  }

  loginForm.addEventListener('submit', function (e) { e.preventDefault(); attemptLogin(); });
  loginBtn.addEventListener('click', function (e) { e.preventDefault(); attemptLogin(); });

  document.getElementById('toggle-pass').addEventListener('click', function () {
    const input = document.getElementById('contrasena');
    const icon = this.querySelector('span');
    const isPassword = input.type === 'password';
    input.type = isPassword ? 'text' : 'password';
    icon.textContent = isPassword ? 'visibility_off' : 'visibility';
  });

  // ── Hub ──
  const loaded = {};

  function mountFrame(uid, key) {
    const url = SECTIONS[key].url;
    if (!url || loaded[uid]) return;
    loaded[uid] = true;
    const iframe = document.getElementById('frame-' + uid);
    iframe.addEventListener('load', function () {
      const loadingEl = document.getElementById('loading-' + uid);
      if (loadingEl) loadingEl.style.display = 'none';
    }, { once: true });
    iframe.src = url;
  }

  let currentGroup = null;

  function buildHub(session) {
    // ── Home: una tarjeta por categoría ──
    const grid = document.getElementById('hub-home-grid');
    grid.innerHTML = '';

    document.getElementById('home-user-name').textContent = session.usuario;
    document.getElementById('home-user-role').textContent = session.rol;
    document.getElementById('hub-home-greeting').textContent = '¿A dónde quieres ir, ' + (session.usuario || '').split(/[.\s_]/)[0] + '?';

    const navContainer = document.getElementById('hub-nav-container');
    const mainContainer = document.getElementById('hub-main-container');
    navContainer.innerHTML = '';
    mainContainer.innerHTML = '';

    GROUP_ORDER.forEach(function (groupKey) {
      const grp = GROUPS[groupKey];
      const sectionsInGroup = session.allowed.filter(function (key) {
        const g = SECTIONS[key] && SECTIONS[key].group;
        return g && (Array.isArray(g) ? g.indexOf(groupKey) !== -1 : g === groupKey);
      });

      const card = document.createElement('div');
      card.className = 'hub-home-card' + (sectionsInGroup.length ? '' : ' disabled');
      if (grp.image) { card.style.backgroundImage = "url('" + grp.image + "')"; }
      else { card.style.background = grp.gradient; }

      const countLbl = sectionsInGroup.length
        ? (sectionsInGroup.length + (sectionsInGroup.length === 1 ? ' sección' : ' secciones'))
        : 'Sin acceso';
      const countIcon = sectionsInGroup.length ? 'chevron_right' : 'lock';

      const iconInner = grp.logo
        ? '<img src="' + grp.logo + '" alt="' + grp.label + '" style="max-width:70%;max-height:70%;object-fit:contain;">'
        : '<span class="material-symbols-outlined">' + grp.icon + '</span>';

      card.innerHTML = '<div class="hc-icon' + (grp.logo ? ' has-logo' : '') + '">' + iconInner + '</div>'
                      + '<div><div class="hc-label">' + grp.label + '</div>'
                      + '<div class="hc-sub">' + countLbl + ' <span class="material-symbols-outlined" style="font-size:14px;">' + countIcon + '</span></div></div>';

      if (sectionsInGroup.length) {
        card.onclick = function () { hubOpenCategory(groupKey, sectionsInGroup); };
      }
      grid.appendChild(card);

      // ── Nav + iframes de esa categoría (construidos una sola vez, se muestran/ocultan) ──
      const navGroup = document.createElement('nav');
      navGroup.className = 'hub-nav-group';
      navGroup.setAttribute('data-group', groupKey);

      const mainGroup = document.createElement('div');
      mainGroup.className = 'hub-main-group';
      mainGroup.setAttribute('data-group', groupKey);

      if (!sectionsInGroup.length) {
        mainGroup.innerHTML = '<div class="hub-empty-cat"><span class="material-symbols-outlined">lock</span><p>No tienes secciones asignadas en esta categoría.</p></div>';
      } else {
        sectionsInGroup.forEach(function (key, idx) {
          const sec = SECTIONS[key];
          const uid = groupKey + '__' + key;

          const navItem = document.createElement('div');
          navItem.className = 'hub-nav-item' + (idx === 0 ? ' active' : '');
          navItem.setAttribute('data-target', uid);
          navItem.onclick = function () { hubShow(uid, key); };
          navItem.innerHTML = '<div class="ic"><span class="material-symbols-outlined">' + sec.icon + '</span></div><div class="lbl">' + sec.label + '</div>';
          navGroup.appendChild(navItem);

          const wrap = document.createElement('div');
          wrap.className = 'hub-frame-wrap' + (idx === 0 ? ' active' : '');
          wrap.id = 'wrap-' + uid;

          if (sec.url) {
            wrap.innerHTML = '<div class="hub-loading" id="loading-' + uid + '"><div class="spin"></div>Cargando ' + sec.label + '…</div>'
                            + '<iframe id="frame-' + uid + '" title="' + sec.label + '" loading="lazy"></iframe>';
          } else {
            wrap.innerHTML = '<div class="hub-placeholder"><span class="material-symbols-outlined">' + sec.icon + '</span>'
                            + '<h2>' + sec.label + '</h2><p>Próximamente. Esta sección se habilitará cuando esté listo el enlace correspondiente.</p></div>';
          }
          mainGroup.appendChild(wrap);
        });
      }

      navContainer.appendChild(navGroup);
      mainContainer.appendChild(mainGroup);
    });
  }

  window.hubOpenCategory = function (groupKey, sectionsInGroup) {
    currentGroup = groupKey;
    document.getElementById('hub-cat-title').textContent = GROUPS[groupKey].label;
    document.querySelectorAll('.hub-nav-group').forEach(function (el) { el.classList.toggle('active', el.getAttribute('data-group') === groupKey); });
    document.querySelectorAll('.hub-main-group').forEach(function (el) { el.classList.toggle('active', el.getAttribute('data-group') === groupKey); });

    document.getElementById('hub-home').classList.remove('active');
    document.getElementById('hub-category').classList.add('active');

    if (sectionsInGroup && sectionsInGroup.length) mountFrame(groupKey + '__' + sectionsInGroup[0], sectionsInGroup[0]);
  };

  window.hubGoHome = function () {
    currentGroup = null;
    document.getElementById('hub-category').classList.remove('active');
    document.getElementById('hub-home').classList.add('active');
  };

  window.hubShow = function (uid, key) {
    document.querySelectorAll('.hub-frame-wrap').forEach(function (el) { el.classList.toggle('active', el.id === 'wrap-' + uid); });
    document.querySelectorAll('.hub-nav-item').forEach(function (el) { el.classList.toggle('active', el.getAttribute('data-target') === uid); });
    mountFrame(uid, key);
  };

  window.hubLogout = function () {
    sessionStorage.removeItem('panel_auth');
    location.reload();
  };

  function showHub(session) {
    loginScreen.classList.add('hide');
    loginFooter.classList.add('hide');
    hubApp.classList.add('show');
    buildHub(session);
    document.getElementById('hub-home').classList.add('active');
  }

  // Sesion ya iniciada en esta pestaña
  const saved = sessionStorage.getItem('panel_auth');
  if (saved) {
    try { showHub(JSON.parse(saved)); } catch (e) { sessionStorage.removeItem('panel_auth'); }
  }
})();
